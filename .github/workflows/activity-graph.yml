name: Update Profile SVGs

on:
  schedule:
    - cron: "0 0 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: erujs
          outputs: profile/github-snake-dark.svg?palette=gitlab-dark&color_snake=teal

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile SVGs"
          branch: main
          file_pattern: "profile/*.svg"
